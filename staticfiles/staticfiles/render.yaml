services:
  - type: web
    name: portfolio-site
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn portfolio_site.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.7"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,niteesh-portfolio-ernb.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://niteesh-portfolio-ernb.onrender.com"
